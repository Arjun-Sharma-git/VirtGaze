camera:
  index: 0
  width: 1280
  height: 720
  fps: 60
  auto_exposure: true
  fourcc: ""                # pixel format to request, e.g. "MJPG"; "" = driver default
  undistort: false          # Apply lens-distortion correction (needs intrinsics)
  intrinsics_path: ""       # Optional .npz from scripts/calibrate_camera.py

detection:
  model: "mediapipe_short"   # "mediapipe_short" | "mediapipe_full"
  detection_interval: 5      # Run full detection every N frames
  min_confidence: 0.5

mesh:
  refine_iris: true
  max_num_faces: 1
  min_detection_confidence: 0.5
  static_image_mode: false

pose:
  solvepnp_method: "SOLVEPNP_ITERATIVE"
  use_ransac: false

gaze:
  eyeball_radius_mm: 12.0
  kappa_yaw: 0.0
  kappa_pitch: 0.0

calibration:
  grid_cols: 5
  grid_rows: 5
  edge_margin: 0.03        # outer dots this far (fraction of the screen) from the edges
  settle_sec: 0.3          # per dot: show it this long before sampling (eyes settle)
  order: "random"          # "random" | "serpentine" (row by row, alternating direction)
  blink_ear_ratio: 0.8     # skip samples whose EAR is below this fraction of recent (0 = off)
  wait_for_face_sec: 2.0   # start once the face is tracked steadily this long (0 = don't wait)
  samples_per_target: 120
  target_duration_sec: 2.0
  pulse_animation: true
  circular_motion: true
  circular_radius_px: 15
  outlier_sigma_threshold: 2.0

quick_calibration:
  points: 5
  samples_per_target: 60
  target_duration_sec: 1.0

mlp:
  # Read by MLPTrainer.from_config(); hidden_dims also defines the architecture
  # stored in each profile checkpoint.
  input_dim: 34
  hidden_dims: [64, 128, 64]
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 200
  batch_size: 32
  early_stopping_patience: 20

inference:
  model: "ridge"      # "ridge": landmark ridge model when the profile has one (EyeTrax
                      # approach, see model/landmark_features.py); "mlp": always the MLP
  ridge_alpha: 100.0  # ridge L2 penalty; higher = smoother, less overfit to calibration
  backend: "onnx"     # "onnx" | "torch" | "tensorrt"
  device: "CPU"       # "CPU" | "CUDA" | "ROCM" | "auto"
                      # ROCM: AMD GPU via ROCm/HIP (requires onnxruntime-rocm)
                      # auto: selects best available device at runtime
                      # Also selects the PyTorch training device (MLPTrainer.from_config).
  fallback_to_geometric: true
                      # false: never project gaze angles geometrically — hold at
                      # the screen centre when no model/low confidence is available.
  confidence_threshold: 0.7
  # Geometric fallback: assumed eye-to-screen distance and the minimum
  # confidence at which the fallback (instead of "hold") is used.
  fallback_distance_mm: 600.0
  geometric_min_confidence: 0.4

filtering:
  ukf:
    process_noise: 1.0
    measurement_noise: 5.0
    alpha: 0.001
    beta: 2.0
    kappa: 0.0
  # Dot only moves once gaze leaves this radius, then trails it (0 = off)
  stabilizer_radius_px: 0.0
  # Blink hold: eye aspect ratio below this fraction of the recent open-eye
  # level counts as a blink; the dot is frozen then and for N frames after
  blink_ear_ratio: 0.75
  blink_hold_frames: 3
  one_euro:
    min_cutoff: 1.0
    beta: 0.015
    d_cutoff: 1.0
  fixation:
    fixation_velocity_threshold: 100.0
    saccade_velocity_threshold: 500.0
    blink_ear_threshold: 0.15
    min_fixation_duration: 0.1

adaptation:
  ridge_refit_every: 5     # implicit clicks between ridge refits (and saves)
  buffer_max_size: 5000
  retrain_threshold: 50
  retrain_lr: 0.0001
  retrain_epochs: 2
  retrain_batch_size: 16
  click_velocity_threshold: 500.0

bias_map:
  cols: 40
  rows: 20
  smoothing_sigma: 1.0

profile:
  profiles_dir: "profiles"
  auto_save: true
  quick_calib_interval_days: 7

logging:
  level: "INFO"
  log_latency: true
  log_fps: true
  save_debug_frames: false
