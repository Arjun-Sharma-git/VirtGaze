# Example configuration for AMD GPU (ROCm) users.
# Install with:  make install-rocm  (only the PyTorch ROCm wheel is needed)
# Run with:      python scripts/run_tracker.py --config configs/example_config_rocm.yaml
#                python scripts/run_calibration.py --config configs/example_config_rocm.yaml

camera:
  index: 0
  width: 1280
  height: 720
  fps: 60

inference:
  backend: "torch"   # In-process PyTorch on the GPU via HIP.  "onnx" needs onnxruntime-rocm,
                     # whose wheels target ROCm 6.x, not the ROCm 7 PyTorch stack.
  device: "ROCM"     # PyTorch device for inference and training (MLPTrainer.from_config);
                     # with backend "onnx" it selects ROCMExecutionProvider.
  fallback_to_geometric: true
  confidence_threshold: 0.7

calibration:
  # 2 s per dot yields only ~30 samples on a 15 FPS webcam; give it longer.
  target_duration_sec: 4.0

mlp:
  input_dim: 34
  hidden_dims: [64, 128, 64]
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 200
  batch_size: 32
  early_stopping_patience: 20

profile:
  profiles_dir: "profiles"

logging:
  level: "INFO"
  log_latency: true
  log_fps: true
