# Example configuration for AMD GPU (ROCm) users.
# Install with:  make install-rocm  (only the PyTorch ROCm wheel is needed)
# Run with:      python scripts/run_tracker.py --config configs/example_config_rocm.yaml
#                python scripts/run_calibration.py --config configs/example_config_rocm.yaml

camera:
  index: 0
  # The camera's default mode (no MJPG compression), as EyeTrax uses: cleaner
  # iris landmarks than compressed 720p on this webcam.
  width: 640
  height: 480
  fps: 30
  fourcc: ""

inference:
  backend: "torch"   # In-process PyTorch on the GPU via HIP.  "onnx" needs onnxruntime-rocm,
                     # whose wheels target ROCm 6.x, not the ROCm 7 PyTorch stack.
  device: "ROCM"     # PyTorch device for inference and training (MLPTrainer.from_config);
                     # with backend "onnx" it selects ROCMExecutionProvider.
  fallback_to_geometric: true
  confidence_threshold: 0.7
  ridge_alpha: 1.0   # EyeTrax's default; raise (e.g. 100) if predictions are noisy

calibration:
  # EyeTrax-style sampling: wait for the face, visit dots row by row, show
  # each dot 2 s before sampling for 1 s, and skip blink frames.
  wait_for_face_sec: 2.0
  order: "serpentine"
  settle_sec: 2.0
  target_duration_sec: 1.0
  blink_ear_ratio: 0.8

filtering:
  # Keeps the dot still for small eye/landmark noise (0 to turn off).
  stabilizer_radius_px: 30.0

mlp:
  input_dim: 34
  hidden_dims: [64, 128, 64]
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 200
  batch_size: 32
  early_stopping_patience: 20

profile:
  profiles_dir: "profiles"

logging:
  level: "INFO"
  log_latency: true
  log_fps: true
