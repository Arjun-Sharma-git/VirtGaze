[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaze-estimation"
version = "0.1.0"
description = "Production-grade 3D gaze estimation system from a standard webcam"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "3dEyeEstim"}]
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "mediapipe>=0.10.0",
    "torch>=2.0.0",
    "onnxruntime>=1.15.0",
    "onnx>=1.14.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "scipy>=1.10.0",
    "pygame>=2.5.0",
    "screeninfo>=0.8.1",
]

[project.optional-dependencies]
# Upper bounds keep a release that widens a linter's default behaviour (or drops
# an interpreter) from turning the build red without a code change; the floor
# matches the version each tool was validated against.
dev = [
    "pytest>=7.0.0,<10",
    "pytest-cov>=4.0.0,<8",
    "pytest-asyncio>=0.21.0,<2",
    "mypy>=1.11,<3",
    "ruff>=0.8,<1",
    "black>=24.0.0,<27",
    "pre-commit>=3.5,<5",
]
# NVIDIA GPU — TensorRT acceleration (requires CUDA + TensorRT installed)
gpu = ["tensorrt>=8.6.0"]
# AMD GPU — ROCm/HIP (install torch+rocm wheel separately, see requirements-rocm.txt)
# onnxruntime-rocm replaces onnxruntime; not installable from PyPI — use pip flag below.
rocm = ["onnxruntime-rocm>=1.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Declare the rule set explicitly.  The previous unpinned `ruff>=0.1.0`
# dependency let ruff's default set grow on every release — ruff 0.16 flags
# >200 issues (pyupgrade modernisations, magic-value checks, …) that this
# project never opted into.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
# Deliberately no python_version pin.
#
# mypy 2.x rejects "3.9", so the old pin made `make typecheck` fail outright.
# Pinning *below* the running interpreter is also unsafe: mypy then parses
# modern stubs (e.g. numpy's PEP 695 `type` statements) with the wrong grammar
# and reports a syntax error inside the stub.  Left unset, mypy targets the
# interpreter it runs under, which is the same interpreter the tests use.
ignore_missing_imports = true
